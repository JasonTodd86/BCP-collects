name: Weekly collect email

on:
  schedule:
    # Two candidate UTC times, one per DST state (minute 7 rather than 0,
    # since GitHub Actions documents top-of-the-hour schedules as most
    # likely to be delayed under load). Both are kept for redundancy --
    # whichever lands closer to 6am Central sends the email; the other is
    # suppressed by the once-per-week cache below, not by a time check,
    # since GitHub has been observed delaying scheduled runs by several
    # hours, which a strict "is it 6am right now" check can't survive.
    # Only a *schedule*-triggered success writes the cache marker, so a
    # manual "Run workflow" test never suppresses that week's real email.
    - cron: "7 11 * * 0"   # ~6:00 AM CDT Sunday (UTC-5, roughly Mar-Nov)
    - cron: "7 12 * * 0"   # ~6:00 AM CST Sunday (UTC-6, roughly Nov-Mar)
  workflow_dispatch: {}

jobs:
  send-collect-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute this week's id
        id: week
        run: echo "id=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Check whether this week's email already went out
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: sent-marker.txt
          key: collect-sent-${{ steps.week.outputs.id }}

      - name: Get today's collect
        if: steps.cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        id: collect
        run: |
          set +e
          python3 scripts/get_collect.py > collect_output.txt 2> collect_error.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Email the collect
        if: (steps.cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch') && steps.collect.outputs.status == '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_USERNAME }}
          to: j.chris.todd@gmail.com
          subject: "Today's collect - ready to post"
          body: file://collect_output.txt

      - name: Mark this week as sent
        if: github.event_name == 'schedule' && steps.collect.outputs.status == '0'
        run: echo "sent $(date -u)" > sent-marker.txt

      - name: Save the sent marker so later runs this week don't resend
        if: github.event_name == 'schedule' && steps.collect.outputs.status == '0'
        uses: actions/cache/save@v4
        with:
          path: sent-marker.txt
          key: collect-sent-${{ steps.week.outputs.id }}

      - name: Email a warning if the collect text is missing
        if: (steps.cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch') && steps.collect.outputs.status != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_USERNAME }}
          to: j.chris.todd@gmail.com
          subject: "ACTION NEEDED: collect text missing for today"
          body: file://collect_error.txt
